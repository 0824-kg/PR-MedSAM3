dataset_key: busi
data_dir: prepared_datasets/BUSI
output_dir: work_dir/BUSI/prompt_robust/cpca_v2
sam3_ckpt: checkpoints/sam3.pt
image_size: 1008
epochs: 20
batch_size: 1
num_workers: 2
robust_method: cpca_v2
num_group_prompts: 2
group_loss_weight: 0.1
proto_loss_weight: 0.05
worst_loss_weight: 0.1
worst_tau: 0.5
lora_lr: 1e-4
cpca_lr: 1e-4
gpsma_lr: 1e-4
decoder_lr: 1e-5
freeze_backbone: true
train_lora: true
train_cpca: true
train_gpsma: false
train_detector: false
prompts_config: configs/prompts.yaml
cpca_variant: v2
cpca_v2_residual_scale: 0.05
cpca_v2_semantic_loss_weight: 0.0
use_worst_loss: false

model:
  checkpoint_path: checkpoints/sam3.pt
  load_from_hf: false
lora:
  rank: 16
  alpha: 32
  dropout: 0.1
  target_modules: [q_proj, k_proj, v_proj, out_proj]
  apply_to_vision_encoder: false
  apply_to_text_encoder: true
  apply_to_geometry_encoder: false
  apply_to_detr_encoder: true
  apply_to_detr_decoder: true
  apply_to_mask_decoder: true
training:
  data_dir: prepared_datasets/BUSI
  batch_size: 1
  num_workers: 2
  num_epochs: 20
  weight_decay: 0.01
  mixed_precision: bf16
  gradient_accumulation_steps: 8
  seed: 42
prompts:
  enabled: true
  config_path: configs/prompts.yaml
  dataset_key: busi
output:
  output_dir: work_dir/BUSI/prompt_robust/cpca_v2
  pretrained_lora_weights: checkpoints/best_lora_weights.pt
robust:
  robust_method: cpca_v2
  num_group_prompts: 2
  group_loss_weight: 0.1
  proto_loss_weight: 0.05
  worst_loss_weight: 0.1
  worst_tau: 0.5
  lora_lr: 1e-4
  cpca_lr: 1e-4
  gpsma_lr: 1e-4
  decoder_lr: 1e-5
  freeze_backbone: true
  train_lora: true
  train_cpca: true
  train_gpsma: false
  train_detector: false
  cpca_variant: v2
  cpca_v2_residual_scale: 0.05
  cpca_v2_semantic_loss_weight: 0.0
  use_worst_loss: false
