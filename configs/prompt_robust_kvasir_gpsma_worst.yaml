dataset_key: sessile_kvasir
data_dir: datasets/sessile-Kvasir
output_dir: work_dir/sessile-Kvasir/prompt_robust/gpsma_worst
sam3_ckpt: checkpoints/sam3.pt
image_size: 1008
epochs: 20
batch_size: 1
num_workers: 2
robust_method: gpsma_worst
num_group_prompts: 2
group_loss_weight: 0.1
proto_loss_weight: 0.05
worst_loss_weight: 0.1
worst_tau: 0.5
lora_lr: 1e-4
cpca_lr: 1e-4
gpsma_lr: 1e-4
decoder_lr: 1e-5
freeze_backbone: true
train_lora: true
train_cpca: false
train_gpsma: true
train_detector: false
cpca_variant: none
use_group_consistency: true
use_worst_loss: true
use_proto_loss: false
prompts_config: configs/prompts.yaml

model:
  checkpoint_path: checkpoints/sam3.pt
  load_from_hf: false
lora:
  rank: 16
  alpha: 32
  dropout: 0.1
  target_modules: [q_proj, k_proj, v_proj, out_proj]
  apply_to_vision_encoder: false
  apply_to_text_encoder: true
  apply_to_geometry_encoder: false
  apply_to_detr_encoder: true
  apply_to_detr_decoder: true
  apply_to_mask_decoder: true
training:
  data_dir: datasets/sessile-Kvasir
  batch_size: 1
  num_workers: 2
  num_epochs: 20
  weight_decay: 0.01
  mixed_precision: bf16
  gradient_accumulation_steps: 8
  seed: 42
prompts:
  enabled: true
  config_path: configs/prompts.yaml
  dataset_key: sessile_kvasir
output:
  output_dir: work_dir/sessile-Kvasir/prompt_robust/gpsma_worst
  pretrained_lora_weights: checkpoints/best_lora_weights.pt
robust:
  robust_method: gpsma_worst
  num_group_prompts: 2
  group_loss_weight: 0.1
  proto_loss_weight: 0.05
  worst_loss_weight: 0.1
  worst_tau: 0.5
  lora_lr: 1e-4
  cpca_lr: 1e-4
  gpsma_lr: 1e-4
  decoder_lr: 1e-5
  freeze_backbone: true
  train_lora: true
  train_cpca: false
  train_gpsma: true
  train_detector: false
  cpca_variant: none
  use_group_consistency: true
  use_worst_loss: true
  use_proto_loss: false
